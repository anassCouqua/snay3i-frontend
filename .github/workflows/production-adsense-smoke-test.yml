name: Production AdSense Smoke Test

on:
  workflow_run:
    workflows: ["Forensic Quality Gate"]
    types: [completed]

permissions:
  contents: read

jobs:
  production-smoke:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the tested main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify the deployed production site
        run: node scripts/production-adsense-smoke-test.js
