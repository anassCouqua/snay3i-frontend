name: Forensic Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: forensic-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run forensic production build
        run: npm run build

      - name: Assert build output
        run: |
          test -f build/index.html
          test -f build/404.html
          test -f build/sitemap.xml
          test -f build/robots.txt
          test -f build/ads.txt
